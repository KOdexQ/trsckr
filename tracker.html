<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>essentials — commit log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161c;
    --bg-raised:#181d25;
    --bg-panel:#1c222b;
    --border:#2a323d;
    --border-soft:#232a33;
    --text:#e9e7df;
    --text-dim:#8b93a3;
    --text-faint:#5b6472;
    --amber:#e3a23c;
    --amber-dim:#7a5c2a;
    --green:#3fb56d;
    --green-soft:#245239;
    --green-glow:rgba(63,181,109,0.45);
    --miss:#3d2426;
    --miss-border:#6b3a3d;
    --future:#252c37;
    --future-border:#3a4353;
    --radius:10px;
    --font-display:'Space Grotesk',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-mono);
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* ---------- terminal header ---------- */
  .termbar{
    display:flex;align-items:center;gap:8px;
    padding:10px 14px;
    background:var(--bg-raised);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:var(--radius) var(--radius) 0 0;
  }
  .dot{width:10px;height:10px;border-radius:50%;}
  .dot.r{background:#e0605a;} .dot.y{background:#e3b23c;} .dot.g{background:#3fb56d;}
  .termbar .path{margin-left:10px;color:var(--text-faint);font-size:12.5px;}

  .header{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:0 0 var(--radius) var(--radius);
    padding:22px 26px 24px;
    margin-bottom:22px;
  }
  .header h1{
    font-family:var(--font-display);
    font-size:26px;font-weight:700;letter-spacing:-0.02em;
    margin:0 0 4px;color:var(--text);
    display:flex;align-items:center;gap:10px;
  }
  .cursor{
    display:inline-block;width:9px;height:20px;background:var(--amber);
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .header .sub{color:var(--text-dim);font-size:13px;}
  .header .sub .prompt{color:var(--green);}

  /* ---------- buttons ---------- */
  button{
    font-family:var(--font-mono);
    cursor:pointer;
  }
  .btn{
    background:var(--bg-raised);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:7px;
    padding:9px 16px;
    font-size:13px;
    font-weight:500;
    transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--text-faint);}
  .btn-primary{
    background:var(--green);
    color:#0e1710;
    border:1px solid var(--green);
    font-weight:600;
  }
  .btn-primary:hover{background:#4fc57d;}
  .btn-primary:disabled{background:var(--green-soft);color:var(--text-faint);cursor:not-allowed;border-color:var(--border);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-faint);}
  .btn-danger{color:#e0605a;border-color:#4a2c2a;background:transparent;}
  .btn-danger:hover{background:#241514;}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}

  /* ---------- cards ---------- */
  .card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:var(--font-display);
    font-size:15px;font-weight:600;
    margin:0 0 4px;
    color:var(--text);
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
  }
  .card .desc{color:var(--text-dim);font-size:12.5px;margin:0 0 16px;line-height:1.5;}
  .eyebrow{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--amber);font-weight:600;margin-bottom:6px;
  }

  /* ---------- setup form ---------- */
  .habit-row{
    display:flex;gap:8px;margin-bottom:8px;align-items:center;
  }
  .habit-row input[type=text]{
    flex:1;
    background:var(--bg-raised);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:9px 12px;
    font-family:var(--font-mono);
    font-size:13px;
  }
  .habit-row input[type=text]:focus{outline:none;border-color:var(--amber);}
  .habit-row .rm{
    width:30px;height:30px;flex:0 0 auto;
    background:transparent;border:1px solid var(--border);color:var(--text-faint);
    border-radius:6px;font-size:15px;line-height:1;
  }
  .habit-row .rm:hover{color:#e0605a;border-color:#4a2c2a;}
  .add-habit{margin-top:6px;}

  .row-line{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px;}
  .field{flex:1;min-width:180px;}
  .field label{display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;}
  .duration-options{display:flex;gap:8px;flex-wrap:wrap;}
  .dur-btn{
    background:var(--bg-raised);border:1px solid var(--border);color:var(--text-dim);
    border-radius:7px;padding:9px 14px;font-size:13px;font-weight:500;
  }
  .dur-btn.active{border-color:var(--amber);color:var(--amber);background:#2a2114;}
  .field input[type=number], .field input[type=date]{
    width:100%;background:var(--bg-raised);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:9px 12px;font-family:var(--font-mono);font-size:13px;
  }
  .setup-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  /* ---------- today checklist ---------- */
  .stat-strip{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .stat{
    flex:1;min-width:120px;
    background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat .val{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--text);}
  .stat .val.amber{color:var(--amber);}
  .stat .val.green{color:var(--green);}
  .stat .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

  .today-status{
    font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600;
    border:1px solid var(--border);color:var(--text-dim);
  }
  .today-status.done{background:#173322;color:var(--green);border-color:var(--green-soft);}
  .today-status.pending{background:#2a2114;color:var(--amber);border-color:var(--amber-dim);}

  .checklist{display:flex;flex-direction:column;gap:8px;}
  .check-item{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-raised);
    border:1px solid var(--border-soft);
    border-radius:8px;
    padding:12px 14px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .check-item:hover{border-color:var(--text-faint);}
  .check-item.checked{border-color:var(--green-soft);background:#152119;}
  .box{
    width:18px;height:18px;flex:0 0 auto;border-radius:5px;border:1.5px solid var(--text-faint);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;
  }
  .check-item.checked .box{background:var(--green);border-color:var(--green);color:#0e1710;}
  .check-item span.label{font-size:13.5px;color:var(--text);}
  .check-item.checked span.label{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--border);}

  .date-nav{display:flex;align-items:center;gap:10px;}
  .date-nav select{
    background:var(--bg-raised);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:6px 10px;font-family:var(--font-mono);font-size:12.5px;
  }

  /* ---------- heatmap ---------- */
  .heatmap-scroll{overflow-x:auto;padding:4px 4px 10px 2px;background:#0e1116;border:1px solid var(--border);border-radius:8px;}
  .heatmap-inner{display:flex;gap:8px;padding:10px 12px;}
  .dow-labels{display:flex;flex-direction:column;gap:5px;padding-top:20px;flex:0 0 auto;}
  .dow-labels span{height:22px;line-height:22px;font-size:11px;color:var(--text-faint);}
  .heatmap-main{display:flex;flex-direction:column;}
  .month-labels{display:flex;gap:4px;margin-bottom:5px;padding-left:1px;}
  .month-labels span{font-size:10.5px;color:var(--text-dim);min-width:17px;}
  .heatmap{display:flex;gap:5px;}
  .week-col{display:flex;flex-direction:column;gap:5px;}
  .cell{
    width:22px;height:22px;border-radius:5px;
    background:var(--future);border:1.5px solid var(--future-border);
    position:relative;cursor:pointer;
  }
  .cell.pad{visibility:hidden;cursor:default;}
  .cell.out-of-range{background:#171a20;border-color:#20252d;cursor:default;}
  .cell.out-of-range:hover{outline:none;}
  .cell.complete{background:var(--green);border-color:#7fe6a9;box-shadow:0 0 9px var(--green-glow);}
  .cell.missed{background:var(--miss);border-color:var(--miss-border);}
  .cell.today-pending{background:var(--amber-dim);border-color:var(--amber);box-shadow:0 0 9px rgba(227,162,60,0.4);}
  .cell.today-complete{background:var(--green);border-color:#7fe6a9;box-shadow:0 0 11px var(--green-glow);}
  .cell:hover{outline:2px solid var(--text);outline-offset:1px;}

  .tooltip{
    position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
    background:#0b0e12;border:1px solid var(--border);border-radius:6px;
    padding:7px 10px;font-size:11px;white-space:nowrap;color:var(--text-dim);
    display:none;z-index:5;pointer-events:none;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }
  .tooltip .commit{color:var(--amber);}
  .tooltip .msg{color:var(--text);}
  .cell:hover .tooltip{display:block;}

  .legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);margin-top:12px;justify-content:flex-end;}
  .legend .cell{width:14px;height:14px;cursor:default;}


  /* ---------- day edit popover ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,10,13,0.65);
    display:none;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .overlay.open{display:flex;}
  .popover{
    background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;
    padding:22px 24px;width:100%;max-width:380px;
  }
  .popover h3{font-family:var(--font-display);font-size:16px;margin:0 0 3px;color:var(--text);}
  .popover .pdate{color:var(--text-dim);font-size:12px;margin-bottom:16px;}
  .popover-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .footer-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .footer-actions .hint{font-size:11.5px;color:var(--text-faint);}

  ::selection{background:var(--amber-dim);}

  @media (prefers-reduced-motion: reduce){
    .cursor{animation:none;opacity:1;}
  }

  @media (max-width:600px){
    .header{padding:18px;}
    .header h1{font-size:21px;}
    .card{padding:16px 16px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="termbar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="path">~/essentials</span>
  </div>
  <div class="header">
    <h1>daily essentials<span class="cursor"></span></h1>
    <div class="sub"><span class="prompt">$</span> commit log of consistency — all-or-nothing, every day</div>
  </div>

  <div id="app"></div>

</div>

<div class="overlay" id="overlay">
  <div class="popover" id="popoverBody"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'tracker-state';
  const app = document.getElementById('app');
  const overlay = document.getElementById('overlay');
  const popoverBody = document.getElementById('popoverBody');

  const DEFAULT_HABITS = [
    'Code for 45+ minutes',
    'Exercise / training session',
    'Read or learn something technical for 30 min',
    'No unnecessary scrolling after 9PM'
  ];

  let state = null; // { habits:[{id,label}], duration, startDate, checkins:{dateStr:{habitId:bool}} }
  let loaded = false;
  let saving = false;
  let viewDate = todayStr(); // date currently shown in the checklist panel

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fmtDate(str){
    const [y,m,d] = str.split('-').map(Number);
    const dt = new Date(y,m-1,d);
    return dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  }
  function addDays(str,n){
    const [y,m,d] = str.split('-').map(Number);
    const dt = new Date(y,m-1,d);
    dt.setDate(dt.getDate()+n);
    return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
  }
  function dateDiff(a,b){ // days from a to b
    const [ay,am,ad]=a.split('-').map(Number), [by,bm,bd]=b.split('-').map(Number);
    return Math.round((new Date(by,bm-1,bd) - new Date(ay,am-1,ad)) / 86400000);
  }

  async function loadState(){
    app.innerHTML = `<div class="card"><div class="desc">loading state…</div></div>`;
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      state = res && res.value ? JSON.parse(res.value) : null;
    }catch(e){
      state = null;
    }
    loaded = true;
    render();
  }

  async function saveState(){
    if(saving) return;
    saving = true;
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    }catch(e){
      console.error('save failed', e);
    }
    saving = false;
  }

  function isComplete(dateStr){
    if(!state || !state.checkins[dateStr]) return false;
    const rec = state.checkins[dateStr];
    return state.habits.length>0 && state.habits.every(h => rec[h.id]===true);
  }

  function dayStatus(dateStr, today){
    if(dateStr > today) return 'future';
    if(dateStr === today) return isComplete(dateStr) ? 'today-complete' : 'today-pending';
    return isComplete(dateStr) ? 'complete' : 'missed';
  }

  function computeStats(){
    const today = todayStr();
    const dates = challengeDates();
    let longest=0, run=0, greenDays=0;
    let current=0;
    // iterate chronologically
    for(const d of dates){
      if(d > today) break;
      if(isComplete(d)){
        run++; greenDays++;
        if(run>longest) longest=run;
      } else {
        run=0;
      }
    }
    // current streak: walk backward from today (or yesterday if today not yet complete)
    let cursor = isComplete(today) ? today : addDays(today,-1);
    while(dates.includes(cursor) && isComplete(cursor)){
      current++;
      cursor = addDays(cursor,-1);
    }
    const elapsedDays = Math.min(dates.length, Math.max(0, dateDiff(state.startDate, today)+1));
    const pct = elapsedDays>0 ? Math.round((greenDays/elapsedDays)*100) : 0;
    const daysLeft = Math.max(0, dateDiff(today, dates[dates.length-1]));
    return { longest, current, greenDays, pct, daysLeft, elapsedDays, total: dates.length };
  }

  function challengeDates(){
    const dates = [];
    for(let i=0;i<state.duration;i++) dates.push(addDays(state.startDate,i));
    return dates;
  }

  // fixed display window for the contribution log: Aug 1 - Dec 31 of the relevant year
  function displayRangeDates(){
    const year = Number((state.startDate || todayStr()).split('-')[0]);
    const start = year+'-08-01';
    const end = year+'-12-31';
    const dates = [];
    let d = start;
    while(d <= end){
      dates.push(d);
      d = addDays(d,1);
    }
    return dates;
  }

  function render(){
    if(!loaded){ return; }
    if(!state){
      renderSetup();
    } else {
      renderDashboard();
    }
  }

  // ---------------- SETUP ----------------
  function renderSetup(prefill){
    const habits = (prefill && prefill.habits) || DEFAULT_HABITS.map(l=>({id:uid(),label:l}));
    const duration = (prefill && prefill.duration) || 30;
    const startDate = (prefill && prefill.startDate) || todayStr();

    app.innerHTML = `
      <div class="card">
        <div class="eyebrow">phase 1</div>
        <h2>define your daily essentials</h2>
        <p class="desc">pick 3–5 core habits. keep them specific enough to be definitively done or not done — no partial credit.</p>
        <div id="habitList"></div>
        <button class="btn btn-ghost btn-sm add-habit" id="addHabitBtn">+ add habit</button>
      </div>

      <div class="card">
        <div class="eyebrow">phase 2</div>
        <h2>choose your challenge duration</h2>
        <p class="desc">the classic milestones — or set a custom length.</p>
        <div class="duration-options" id="durOpts">
          <button class="dur-btn" data-d="15">15-day sprint</button>
          <button class="dur-btn" data-d="30">30-day habit builder</button>
          <button class="dur-btn" data-d="75">75-day ultimate</button>
          <button class="dur-btn" data-d="custom">custom</button>
        </div>
        <div class="row-line">
          <div class="field" id="customDaysField" style="display:none;">
            <label>days</label>
            <input type="number" id="customDays" min="1" max="365" value="${duration}">
          </div>
          <div class="field">
            <label>start date</label>
            <input type="date" id="startDate" value="${startDate}">
          </div>
        </div>
        <div class="setup-footer">
          <button class="btn btn-primary" id="startBtn">start challenge →</button>
        </div>
      </div>
    `;

    let habitState = habits.map(h=>({...h}));
    let selectedDuration = duration;

    function renderHabitRows(){
      const list = document.getElementById('habitList');
      list.innerHTML = habitState.map(h => `
        <div class="habit-row" data-id="${h.id}">
          <input type="text" maxlength="60" value="${escapeAttr(h.label)}" placeholder="e.g. Code for 45 minutes">
          <button class="rm" title="remove">×</button>
        </div>
      `).join('');
      list.querySelectorAll('.habit-row input').forEach(inp=>{
        inp.addEventListener('input', e=>{
          const id = e.target.closest('.habit-row').dataset.id;
          const h = habitState.find(x=>x.id===id);
          if(h) h.label = e.target.value;
          validate();
        });
      });
      list.querySelectorAll('.rm').forEach(btn=>{
        btn.addEventListener('click', e=>{
          const id = e.target.closest('.habit-row').dataset.id;
          if(habitState.length<=1) return;
          habitState = habitState.filter(x=>x.id!==id);
          renderHabitRows();
          validate();
        });
      });
      document.getElementById('addHabitBtn').style.display = habitState.length>=5 ? 'none' : 'inline-block';
    }
    renderHabitRows();

    document.getElementById('addHabitBtn').addEventListener('click', ()=>{
      if(habitState.length>=5) return;
      habitState.push({id:uid(), label:''});
      renderHabitRows();
      validate();
    });

    const durOpts = document.getElementById('durOpts');
    function setDuration(val){
      selectedDuration = val;
      durOpts.querySelectorAll('.dur-btn').forEach(b=>b.classList.toggle('active', b.dataset.d===String(val) || (val!=='15'&&val!=='30'&&val!=='75'&&b.dataset.d==='custom')));
      document.getElementById('customDaysField').style.display = (val==='custom') ? 'block' : 'none';
    }
    durOpts.querySelectorAll('.dur-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(b.dataset.d==='custom'){
          setDuration('custom');
          selectedDuration = parseInt(document.getElementById('customDays').value)||30;
        } else {
          setDuration(b.dataset.d);
          selectedDuration = parseInt(b.dataset.d);
        }
      });
    });
    document.getElementById('customDays').addEventListener('input', e=>{
      selectedDuration = parseInt(e.target.value)||1;
    });
    setDuration(duration===15||duration===30||duration===75 ? String(duration) : 'custom');

    function validate(){
      const filled = habitState.filter(h=>h.label.trim().length>0);
      document.getElementById('startBtn').disabled = filled.length<3;
    }
    validate();

    document.getElementById('startBtn').addEventListener('click', async ()=>{
      const filled = habitState.filter(h=>h.label.trim().length>0).slice(0,5);
      if(filled.length<3) return;
      const sd = document.getElementById('startDate').value || todayStr();
      state = {
        habits: filled.map(h=>({id:h.id, label:h.label.trim()})),
        duration: selectedDuration,
        startDate: sd,
        checkins: {}
      };
      await saveState();
      render();
    });
  }

  function escapeAttr(s){
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }
  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---------------- DASHBOARD ----------------
  function renderDashboard(){
    const today = todayStr();
    const stats = computeStats();
    const dates = challengeDates();
    const challengeOver = today > dates[dates.length-1];

    app.innerHTML = `
      <div class="stat-strip">
        <div class="stat"><div class="val amber">${stats.current}</div><div class="lbl">current streak</div></div>
        <div class="stat"><div class="val green">${stats.longest}</div><div class="lbl">longest streak</div></div>
        <div class="stat"><div class="val">${stats.greenDays}/${stats.total}</div><div class="lbl">green days</div></div>
        <div class="stat"><div class="val">${stats.pct}%</div><div class="lbl">completion rate</div></div>
        <div class="stat"><div class="val">${challengeOver ? 'done' : stats.daysLeft}</div><div class="lbl">${challengeOver ? 'challenge complete' : 'days remaining'}</div></div>
      </div>

      <div class="card">
        <h2>
          <span id="checklistTitle">today's essentials</span>
          <span class="today-status ${isComplete(viewDate) ? 'done':'pending'}" id="todayBadge">${isComplete(viewDate) ? '✓ committed' : (dateDiff(state.startDate,viewDate)>=0 && dateDiff(state.startDate,viewDate)<state.duration ? 'in progress' : 'out of range')}</span>
        </h2>
        <p class="desc">all essentials must be checked to earn the green dot for the day — mirrors how a commit either lands or it doesn't.</p>
        <div class="date-nav" style="margin-bottom:14px;">
          <select id="dateSelect"></select>
        </div>
        <div class="checklist" id="checklist"></div>
      </div>

      <div class="card">
        <h2>contribution log</h2>
        <p class="desc">hover a block for its commit message. click to view or backfill a day.</p>
        <div class="heatmap-scroll">
          <div id="heatmap"></div>
        </div>
        <div class="legend">
          <span class="hint" id="rangeHint" style="margin-right:auto;"></span>
          <span>outside challenge</span>
          <div class="cell out-of-range"></div>
          <div class="cell missed"></div>
          <div class="cell future"></div>
          <div class="cell complete"></div>
          <span>committed</span>
        </div>
      </div>

      <div class="card">
        <h2>essentials list</h2>
        <p class="desc">editing this changes what counts toward every day's green dot, including past ones.</p>
        <div id="habitsReadout"></div>
        <div class="footer-actions">
          <span class="hint">${state.habits.length} habit${state.habits.length===1?'':'s'} · started ${fmtDate(state.startDate)} · ${state.duration}-day challenge</span>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost btn-sm" id="editHabitsBtn">edit essentials</button>
            <button class="btn btn-danger btn-sm" id="resetBtn">reset challenge</button>
          </div>
        </div>
      </div>
    `;

    renderDateSelect(dates, today);
    renderChecklist();
    renderHeatmap(displayRangeDates(), today, new Set(dates));
    renderHabitsReadout();
    const rangeHintEl = document.getElementById('rangeHint');
    if(rangeHintEl){
      const rd = displayRangeDates();
      rangeHintEl.textContent = `showing ${fmtDate(rd[0])} – ${fmtDate(rd[rd.length-1])}`;
    }

    document.getElementById('resetBtn').addEventListener('click', ()=>{
      openConfirmReset();
    });
    document.getElementById('editHabitsBtn').addEventListener('click', ()=>{
      renderSetup({habits: state.habits, duration: state.duration, startDate: state.startDate});
    });
  }

  function renderDateSelect(dates, today){
    const sel = document.getElementById('dateSelect');
    const upto = dates.filter(d => d<=today);
    const opts = upto.length ? upto : [today];
    sel.innerHTML = opts.slice().reverse().map(d => `<option value="${d}" ${d===viewDate?'selected':''}>${d===today ? 'today · ' : ''}${fmtDate(d)}</option>`).join('');
    sel.addEventListener('change', e=>{
      viewDate = e.target.value;
      renderChecklist();
      const badge = document.getElementById('todayBadge');
      badge.className = 'today-status ' + (isComplete(viewDate) ? 'done':'pending');
      badge.textContent = isComplete(viewDate) ? '✓ committed' : 'in progress';
      document.getElementById('checklistTitle').textContent = viewDate===today ? "today's essentials" : fmtDate(viewDate)+"'s essentials";
    });
  }

  function renderChecklist(){
    const list = document.getElementById('checklist');
    const rec = state.checkins[viewDate] || {};
    list.innerHTML = state.habits.map(h => `
      <div class="check-item ${rec[h.id] ? 'checked':''}" data-id="${h.id}">
        <div class="box">✓</div>
        <span class="label">${escapeHtml(h.label)}</span>
      </div>
    `).join('');
    list.querySelectorAll('.check-item').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const id = el.dataset.id;
        if(!state.checkins[viewDate]) state.checkins[viewDate] = {};
        state.checkins[viewDate][id] = !state.checkins[viewDate][id];
        await saveState();
        renderDashboard();
      });
    });
  }

  function renderHeatmap(dates, today, challengeSet){
    const container = document.getElementById('heatmap');
    const first = dates[0];
    const [fy, fm, fd] = first.split('-').map(Number);
    const firstDow = new Date(fy, fm - 1, fd).getDay(); // 0=Sun
    const padded = [];
    for(let i=0;i<firstDow;i++) padded.push(null);
    padded.push(...dates);
    while(padded.length % 7 !== 0) padded.push(null);

    const weeks = [];
    for(let i=0;i<padded.length;i+=7) weeks.push(padded.slice(i,i+7));

    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let lastLabeledMonth = -1;
    const monthLabels = weeks.map((week,wi) => {
      const firstReal = week.find(d=>d);
      if(!firstReal) return '';
      const dayNum = Number(firstReal.split('-')[2]);
      const mIdx = Number(firstReal.split('-')[1]) - 1;
      // label the week a new month begins in, but never repeat the same month twice in a row
      if(dayNum <= 7 && mIdx !== lastLabeledMonth){
        lastLabeledMonth = mIdx;
        return monthNames[mIdx];
      }
      return '';
    });

    container.innerHTML = `
      <div class="heatmap-inner">
        <div class="dow-labels"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
        <div class="heatmap-main">
          <div class="month-labels">${monthLabels.map(m=>`<span>${m}</span>`).join('')}</div>
          <div class="heatmap">${weeks.map(week => `
            <div class="week-col">
              ${week.map(d => {
                if(!d) return `<div class="cell pad"></div>`;
                const inChallenge = challengeSet.has(d);
                if(!inChallenge){
                  return `<div class="cell out-of-range" data-date="${d}">
                    <div class="tooltip"><span class="commit">${d}</span><br><span class="msg">outside the current challenge</span></div>
                  </div>`;
                }
                const status = dayStatus(d, today);
                const rec = state.checkins[d] || {};
                const doneCount = state.habits.filter(h=>rec[h.id]).length;
                let msg;
                if(status==='future') msg = 'not yet started';
                else if(status==='complete' || status==='today-complete') msg = `all ${state.habits.length} essentials landed`;
                else msg = `${doneCount}/${state.habits.length} essentials — no commit`;
                return `<div class="cell ${status}" data-date="${d}">
                  <div class="tooltip"><span class="commit">${d}</span><br><span class="msg">${msg}</span></div>
                </div>`;
              }).join('')}
            </div>
          `).join('')}</div>
        </div>
      </div>
    `;

    container.querySelectorAll('.cell[data-date]').forEach(el=>{
      if(el.classList.contains('out-of-range')) return;
      el.addEventListener('click', ()=> openDayPopover(el.dataset.date, today));
    });
  }

  function renderHabitsReadout(){
    const el = document.getElementById('habitsReadout');
    el.innerHTML = `<div class="checklist">${state.habits.map(h=>`
      <div class="check-item checked" style="cursor:default;">
        <div class="box">✓</div><span class="label">${escapeHtml(h.label)}</span>
      </div>`).join('')}</div>`;
  }

  function openDayPopover(dateStr, today){
    if(dateStr > today){
      popoverBody.innerHTML = `
        <h3>${fmtDate(dateStr)}</h3>
        <div class="pdate">this day hasn't arrived yet.</div>
        <div class="popover-footer"><button class="btn btn-ghost" id="closePop">close</button></div>
      `;
      overlay.classList.add('open');
      document.getElementById('closePop').addEventListener('click', closePopover);
      return;
    }
    const rec = state.checkins[dateStr] || {};
    popoverBody.innerHTML = `
      <h3>${fmtDate(dateStr)}</h3>
      <div class="pdate">${isComplete(dateStr) ? '✓ green day — every essential landed' : 'not a green day yet'}</div>
      <div class="checklist" id="popChecklist">
        ${state.habits.map(h=>`
          <div class="check-item ${rec[h.id]?'checked':''}" data-id="${h.id}">
            <div class="box">✓</div><span class="label">${escapeHtml(h.label)}</span>
          </div>`).join('')}
      </div>
      <div class="popover-footer">
        <button class="btn btn-ghost" id="closePop">close</button>
      </div>
    `;
    overlay.classList.add('open');
    popoverBody.querySelectorAll('.check-item').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const id = el.dataset.id;
        if(!state.checkins[dateStr]) state.checkins[dateStr] = {};
        state.checkins[dateStr][id] = !state.checkins[dateStr][id];
        await saveState();
        openDayPopover(dateStr, today);
        renderDashboard();
      });
    });
    document.getElementById('closePop').addEventListener('click', closePopover);
  }

  function closePopover(){
    overlay.classList.remove('open');
    popoverBody.innerHTML = '';
  }
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closePopover(); });

  function openConfirmReset(){
    popoverBody.innerHTML = `
      <h3>reset challenge?</h3>
      <div class="pdate">this clears your essentials and every recorded day. it can't be undone.</div>
      <div class="popover-footer">
        <button class="btn btn-ghost" id="cancelReset">cancel</button>
        <button class="btn btn-danger" id="confirmReset">reset everything</button>
      </div>
    `;
    overlay.classList.add('open');
    document.getElementById('cancelReset').addEventListener('click', closePopover);
    document.getElementById('confirmReset').addEventListener('click', async ()=>{
      try{
        await window.storage.delete(STORAGE_KEY, false);
      }catch(e){ /* ignore if already absent */ }
      state = null;
      closePopover();
      render();
    });
  }

  loadState();
})();
</script>
</body>
</html>
